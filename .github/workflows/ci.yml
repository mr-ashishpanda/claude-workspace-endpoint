name: CI

# Runs on every PR and on merge to master (a merge is a push to master), plus
# on version tags. Builds, verifies, packs the npm tarball, and uploads it as a
# downloadable GitHub Actions artifact on every run. On a `v*` tag push it also
# publishes a GitHub Release with the tarball attached, so users can fetch a
# stable, permanent "latest" build with:
#   gh release download --repo mr-ashishpanda/claude-workspace-endpoint \
#     --pattern '*.tgz' -D /tmp/slack-claude-pkg --clobber
#   npm install -g /tmp/slack-claude-pkg/*.tgz
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # On a `v*` tag push, the tag must match package.json's version — otherwise
      # the release would ship a tarball whose internal version disagrees with the
      # release name. Fail fast, before building.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version — bump package.json before tagging."
            exit 1
          fi
          echo "Version check OK: package.json $pkg_version matches tag $GITHUB_REF_NAME"

      # `npm ci` runs the `prepare` script, which builds dist/. Running the full
      # gate and an explicit build afterwards keeps failures easy to localize.
      - run: npm ci
      - run: npm run verify
      - run: npm run build

      - name: Pack npm tarball
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: slack-claude-bridge-npm-package
          path: "*.tgz"
          if-no-files-found: error

      - name: Publish GitHub release with npm tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" *.tgz --title "${{ github.ref_name }}" --generate-notes
